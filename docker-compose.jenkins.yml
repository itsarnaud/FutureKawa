# Local Jenkins stack — opt-in, separate from docker-compose.yml (the app
# stack). Lets you run the repo's Jenkinsfile end-to-end without pushing to
# GitHub first. Start with `./scripts/start-jenkins.sh`.
#
# Docker access: docker-socket-proxy sits between Jenkins and the real host
# socket, exposing only the API surface the Jenkinsfile actually needs
# (containers, exec, images/build) instead of a raw bind-mount of
# /var/run/docker.sock into a disposable container.
#
# Networking: the Jenkinsfile hardcodes DATABASE_URL=...@localhost:55432/...
# and its ephemeral Postgres is started with `docker run -p 55432:5432`
# (a sibling container on the host engine). `network_mode: host` on the
# jenkins service makes that `localhost` resolve correctly without touching
# the Jenkinsfile. Linux-only — fine for local dev use here.

name: futurekawa-jenkins

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: jenkins-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
      POST: 1
      INFO: 1
      VERSION: 1
      PING: 1
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      SWARM: 0
      NODES: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:2375:2375'

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    container_name: futurekawa-jenkins
    restart: unless-stopped
    network_mode: host
    depends_on:
      - docker-socket-proxy
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      # The Git plugin refuses file:// checkouts by default (treated as
      # potentially insecure); the seeded job intentionally reads the
      # Jenkinsfile from the repo bind-mounted read-only at
      # /repo-checkout-source, so this must be explicitly allowed.
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./docker/jenkins/casc:/var/jenkins_home/casc_configs:ro
      - .:/repo-checkout-source:ro

volumes:
  jenkins_home:
