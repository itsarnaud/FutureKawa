name: CI

# Runs on every pull request and on every push to main/develop (i.e. every
# merge) — mirrors the Jenkinsfile stages (lint -> test -> build ->
# integration -> Docker packaging) but needs no infrastructure of its own:
# GitHub provides the runner and the Postgres service container.

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # package-lock.json was written with npm 11. npm 10 (bundled with Node 20
  # on the runners) resolves some optional peer deps (chokidar/readdirp/yaml,
  # pulled in transitively by sass and @angular-devkit/core) differently and
  # rejects the lock file with "Missing: ... from lock file" even though it
  # is up to date. Force the same major version used to generate the lock
  # file before running npm ci.
  NPM_VERSION: '11.9.0'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx nx run-many -t lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      # Country-api and alerting-service import the generated @prisma/client
      # (types, enums) even in unit tests with mocked Prisma — without this
      # step both suites fail with "Cannot find module '.prisma/client/default'".
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx nx run-many -t test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx nx run-many -t build

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/mydb?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma db push --schema prisma/schema.prisma --accept-data-loss
      - run: SEED_COUNTRY=BR npx prisma db seed
      - run: npx nx test-e2e country-api

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml services reference `env_file: - .env`; Compose
      # validates that file exists even for `build` (not just `up`), and it's
      # gitignored so a fresh checkout never has one.
      - run: cp .env.exemple .env
      - run: docker compose build country-api-bresil gateway alerting-bresil fe
